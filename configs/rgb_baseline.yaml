seed: 42

data:
  root: cifake-real-and-ai-generated-synthetic-images
  train_manifest: data/manifests/cifake_train.csv
  val_manifest: data/manifests/cifake_val.csv
  test_manifest: data/manifests/cifake_test.csv
  image_size: 224
  num_workers: 0
  balanced_sampling: true
  sampling_columns: [label, dataset, generator]

model:
  backbone: swin_tiny_patch4_window7_224.ms_in1k
  pretrained: true
  dropout: 0.2
  cache_dir: models
  use_phase: false

training:
  epochs: 10
  batch_size: 32
  backbone_lr: 0.00003
  head_lr: 0.0003
  weight_decay: 0.05
  gradient_clip: 1.0
  warmup_epochs: 1
  amp: true
  early_stopping_patience: 3

output:
  checkpoint_dir: checkpoints
  log_dir: logs/rgb_baseline
